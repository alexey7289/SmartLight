<!DOCTYPE html>
<html lang="ru" class="light-theme">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">	<title>SmartLight</title>
    <title>Тестовая версия сайта</title>
	<link rel="icon" href="data:,"> <!-- Пустая favicon -->
	<link rel="stylesheet" href="css/styles.css">
	<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,150,0..1,-50..200&icon_names=light_off,lightbulb"/>
	<style>
		body {
			font-family: 'Roboto', sans-serif;
		}
	</style>
	<script type="importmap">
		{
			"imports": {
				"@material/web/": "https://esm.run/@material/web/"
			}
		}
	</script>
	<script type="module">
		import '@material/web/all.js';
		import {styles as typescaleStyles} from '@material/web/typography/md-typescale-styles.js';

		document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
	</script>
	<script src="app.js" defer></script>
</head>
<body>

    <h1>SmartLight <span><sup id="appVersion">Загрузка...</sup></span></h1>
        
    <label for="toggleIsDark">Темная тема</label>
    <md-switch id="toggleIsDark"></md-switch>
       	<br>
		<br>
	<md-outlined-text-field id="fieldDimsX" label="Размер X" value="20" max="10000" min="5" type="number" no-spinner error-text="Ошибка" quick></md-outlined-text-field>
	<md-outlined-text-field id="fieldDimsY" label="Размер Y" value="20" max="10000" min="5" type="number" no-spinner error-text="Ошибка"></md-outlined-text-field>
	<md-outlined-text-field id="fieldDimsA" label="Размер A" value="20" max="10000" min="5" type="number" no-spinner error-text="Ошибка"></md-outlined-text-field>
	<md-outlined-text-field id="fieldDimsB" label="Размер B" value="20" max="10000" min="5" type="number" no-spinner error-text="Ошибка"></md-outlined-text-field>
	<md-outlined-text-field id="fieldPixelSize" label="Размер пикселя" value="20" max="10000" min="5" type="number" no-spinner error-text="Ошибка"></md-outlined-text-field>
		<br>
		<br>
	<md-outlined-button id="btnSaveDims">
		Сохранить
	</md-outlined-button>
	<br>
	<br>
	<md-outlined-select id="selectPatternId"
		label="Рисунок" quick>
		<md-select-option value="1"><div slot="headline">1. Яблоко</div></md-select-option>
    	<md-select-option value="2"><div slot="headline">2. Груша</div></md-select-option>
		<md-select-option value="3"><div slot="headline">3. Лимон</div></md-select-option>
    	<md-select-option value="4"><div slot="headline">4. Апельсин</div></md-select-option>
	</md-outlined-select>
	<br>
	<br>
	<div style="margin-top: 20px;"></div>
	<md-outlined-text-field 
		id="logField" 
		label="Логи приложения" 
		type="textarea"
		rows="5"
		style="width: 575px;">
	</md-outlined-text-field>
	<br>
	<br>
	<md-outlined-button id="btnClearLog" onclick="document.getElementById('logField').reset()">
    	Очистить лог
	</md-outlined-button>
    
    <br>
	<div style="margin-top: 20px;"></div>
    <md-fab variant="tertiary" lowered id="toggleIsPower" >
        <md-icon slot="icon">lightbulb</md-icon>
    </md-fab>

</body>
</html>
